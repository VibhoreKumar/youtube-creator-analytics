name: Supabase Keep-Alive

on:
  schedule:
    # Runs every Monday and Thursday at 3 AM UTC - keeps the gap between
    # pings under 4 days, safely inside Supabase's 7-day pause threshold
    - cron: "0 3 * * 1,4"
  workflow_dispatch:  # lets you also trigger it manually from GitHub's Actions tab

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ping Supabase
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB: ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: python run/keep_alive.py